name: Release

# Pushing a tag `vX.Y.Z` runs the whole CI suite on that tag and, only when it passes, builds
# the sdist and wheel and publishes a GitHub release whose notes are that version's section
# of CHANGELOG.md:
#
#   git tag -a v0.2.0 -m "AriaStreamLab 0.2.0" && git push origin v0.2.0
#
# The tag must look like vX.Y.Z and match `version` in pyproject.toml; the job refuses
# otherwise.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag to (re)publish, e.g. v0.2.0"
        required: true

# read-only by default; only the publishing job may write (and only release assets)
permissions:
  contents: read

jobs:
  ci:
    name: CI on the tag
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      # user input reaches the shell only through the environment, never as `${{ }}` text
      # pasted into a script (that would let a crafted tag name run commands)
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Check the tag and match it against pyproject.toml
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$TAG' is not of the form vX.Y.Z" >&2; exit 1
          fi
          VERSION="${TAG#v}"
          PYPROJECT=$(python3 scripts/release_notes.py --version)
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "tag $TAG does not match pyproject version $PYPROJECT" >&2; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Release notes from CHANGELOG.md
        run: |
          python3 scripts/release_notes.py "$VERSION" > notes.md
          cat notes.md

      - name: Build sdist and wheel
        run: uv build

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "AriaStreamLab $VERSION" --notes-file notes.md
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" --title "AriaStreamLab $VERSION" \
              --notes-file notes.md dist/*
          fi
