name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # the release workflow runs the whole suite on the tag before it publishes anything
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (default: the triggering commit)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

env:
  # never open a browser or a window from a test
  ARIASTREAMLAB_OPEN_BROWSER: "0"
  ARIASTREAMLAB_RERUN_SPAWN: "0"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    name: ruff · mypy · import contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python 3.11
          uv pip install -e ".[dev]"
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Mypy
        run: uv run mypy
      - name: Import contracts
        run: uv run lint-imports

  types-oldest:
    # Python 3.10 resolves older numpy / pyarrow / pydantic: annotations that hold with the
    # 3.11 stubs can fail there (0.2.1), so mypy runs on the oldest supported version too
    name: mypy · py3.10
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install
        run: |
          uv venv --python 3.10
          uv pip install -e ".[dev]"
      - name: Mypy
        run: uv run mypy

  test:
    name: pytest · ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install (no Aria SDK — the unit tests must not need it)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
      - name: Pytest (hardware tests deselected, SDK and VRS tests skip themselves)
        run: uv run pytest -m "not hardware" -q

  build:
    name: sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Build
        run: uv build
      - name: Check that the wheel installs and the CLI answers
        run: |
          uv venv --python 3.11
          uv pip install dist/*.whl
          uv run ariastreamlab --version
          uv run ariastreamlab doctor || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
